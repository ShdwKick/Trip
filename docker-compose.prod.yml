name: bh-trip

services:
  trip:
    image: shadowkick/trip:latest
    container_name: trip
    restart: unless-stopped
    labels:
      # Разрешаем Watchtower обновлять контейнер автоматически, когда в Docker Hub
      # появляется новый образ. Без метки он его не тронет: на сервере включён
      # режим строго opt-in (WATCHTOWER_LABEL_ENABLE=true), иначе он трогал бы и
      # чужие контейнеры. Установка — deploy/watchtower-compose.yml в репозитории Auth.
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      HOST: 0.0.0.0
      PORT: 8790
      # Общий auth-сервис. ОБЯЗАТЕЛЬНО и ровно тот адрес, что задан у auth в ISSUER:
      # он подписан внутрь токенов и сверяется побайтово. Без него сервис не стартует.
      AUTH_ISSUER: https://auth.burninghouse.ru
      AUTH_CLIENT_ID: trip
      # Общий секрет для Admin: доступ к /internal/stats и /internal/logs.
      # То же самое значение — в Auth, Финансах, Movies и в самом Admin.
      # Берётся из того же .env, что и GIGACHAT_AUTH_KEY ниже (права 600), в
      # репозиторий не попадает. Сгенерировать: openssl rand -hex 32. Пустым —
      # /internal/* просто всегда отвечает 403, а не падает — безопасный дефолт.
      ADMIN_INTERNAL_KEY: ${ADMIN_INTERNAL_KEY:-}
      # Распознавание чека по фото. Ключ берётся из файла .env рядом с этим
      # compose (права 600) и НИКОГДА не попадает ни в репозиторий, ни в образ:
      # образ публичный, а секрет внутри образа — секрет для всех.
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Pro}
      # Домены Сбера подписаны корневым сертификатом Минцифры, которого нет в
      # alpine. Без него TLS не поднимется, а отключать проверку нельзя — по
      # этой связи уходит фотография чека.
      NODE_EXTRA_CA_CERTS: /app/certs/russian_trusted_root_ca.pem
      # Сервис должен быть зарегистрирован в auth как клиент:
      #   docker compose exec auth node server.js client-add trip "Куда поедем?" https://trip.burninghouse.ru/
      # Фронт и API на одном домене, CORS не нужен.
    ports:
      # Только на localhost — наружу отдаёт nginx на 443 (см. README.md).
      - "127.0.0.1:8790:8790"
    volumes:
      - trip-data:/app/data
      # Сертификат кладут на сервер рядом с compose: он публичный, но в образ
      # его не зашиваем — обновится у Минцифры, менять придётся файл, а не сборку.
      - ./russian_trusted_root_ca.pem:/app/certs/russian_trusted_root_ca.pem:ro

volumes:
  trip-data:
