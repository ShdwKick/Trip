# «Куда поедем?» на trip.burninghouse.ru, стандартный порт 443.
# Кладётся в /etc/nginx/sites-available/trip и линкуется в sites-enabled.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name trip.burninghouse.ru;

    ssl_certificate     /etc/letsencrypt/live/trip.burninghouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trip.burninghouse.ru/privkey.pem;

    # Фотографии: браузер сжимает снимок перед отправкой примерно до 200 КБ, но
    # предел сервиса — 4 МБ (MAX_PHOTO_BYTES). Значение по умолчанию у nginx —
    # 1 МБ, и с ним крупные загрузки отваливались бы с 413 ещё до сервиса.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name trip.burninghouse.ru;
    return 301 https://$host$request_uri;
}
